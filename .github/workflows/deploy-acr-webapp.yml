# Build Docker image → push to Azure Container Registry → update Linux Web App container
#
# Required GitHub Actions secrets (OIDC): AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
# Required GitHub Actions variables: ACR_NAME, AZURE_RESOURCE_GROUP, AZURE_WEBAPP_NAME, IMAGE_REPOSITORY
# See docs/DEPLOY-AZURE.md

name: Deploy crawler (ACR + Web App)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker tag (leave empty for 7-char git SHA)"
        required: false
        default: ""

concurrency:
  group: deploy-crawler-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: meta
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR (docker)
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - name: Build and push image
        env:
          REGISTRY: ${{ vars.ACR_NAME }}.azurecr.io
          REPOSITORY: ${{ vars.IMAGE_REPOSITORY }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -eux
          IMAGE="${REGISTRY}/${REPOSITORY}:${TAG}"
          echo "Deploying image: ${IMAGE}"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          docker build -t "${IMAGE}" .
          docker push "${IMAGE}"

      - name: Deploy container to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          resource-group: ${{ vars.AZURE_RESOURCE_GROUP }}
          slot-name: production
          images: ${{ env.IMAGE }}
